


<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5학년 1학기 사회 [3단원: 법과 인권의 보장] 종합 퀴즈 게임</title>
    <style>
        :root {
            --primary: #4A90E2;
            --primary-dark: #357ABD;
            --success: #2ECC71;
            --danger: #E74C3C;
            --background: #F5F7FA;
            --card-bg: #FFFFFF;
            --text: #2C3E50;
        }
        
        * { box-sizing: border-box; font-family: 'Malgun Gothic', sans-serif; }
        body { background-color: var(--background); color: var(--text); margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .quiz-container { background: var(--card-bg); width: 100%; max-width: 700px; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); }
        h1 { text-align: center; color: var(--primary); font-size: 24px; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #7F8C8D; font-size: 14px; margin-bottom: 25px; }
        .progress-bar { width: 100%; height: 10px; background-color: #ECF0F1; border-radius: 5px; margin-bottom: 25px; overflow: hidden; }
        .progress { height: 100%; background-color: var(--primary); width: 0%; transition: width 0.3s ease; }
        .stats { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 15px; font-size: 16px; }
        .question-box { font-size: 18px; font-weight: bold; line-height: 1.6; margin-bottom: 25px; min-height: 60px; white-space: pre-line; }
        .options-container { display: flex; flex-direction: column; gap: 12px; }
        .option-btn { background: #F8F9FA; border: 2px solid #E2E8F0; border-radius: 12px; padding: 15px 20px; font-size: 16px; text-align: left; cursor: pointer; transition: all 0.2s; font-weight: 500; -webkit-tap-highlight-color: transparent; }
        .option-btn:hover { background: #EDF2F7; border-color: #CBD5E0; }
        .option-btn.correct { background-color: #D4EDDA !important; border-color: var(--success) !important; color: #155724; font-weight: bold; }
        .option-btn.wrong { background-color: #F8D7DA !important; border-color: var(--danger) !important; color: #721C24; }
        .hint-box { margin-top: 15px; padding: 12px; border-radius: 10px; background-color: #FEFCBF; border: 1px dashed #D69E2E; color: #744210; font-size: 14px; display: none; }
        .control-panel { display: flex; justify-content: space-between; margin-top: 25px; }
        .btn { background-color: var(--primary); color: white; border: none; border-radius: 10px; padding: 12px 25px; font-size: 16px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        .btn:hover { background-color: var(--primary-dark); }
        .btn:disabled { background-color: #CBD5E0; cursor: not-allowed; }
        .feedback-box { margin-top: 20px; padding: 15px; border-radius: 12px; background-color: #EBF8FF; border-left: 5px solid var(--primary); display: none; line-height: 1.5; font-size: 15px; }
        .result-screen { text-align: center; display: none; }
        .result-score { font-size: 48px; font-weight: bold; color: var(--primary); margin: 20px 0; }
        .comment { font-size: 18px; line-height: 1.6; margin-bottom: 30px; }
        [hidden] { display: none !important; }
        .field-label { display: block; text-align: left; font-weight: 700; font-size: 14px; color: #7F8C8D; margin: 16px 0 6px; }
        .in-field { width: 100%; padding: 14px; font-size: 18px; border: 2px solid #E2E8F0; border-radius: 12px; background: #fff; }
        .start-msg { color: var(--danger); font-weight: 700; font-size: 14px; margin-top: 12px; }
        .send-status { font-size: 15px; font-weight: 700; margin: 0 0 14px; line-height: 1.5; }
        .send-status.ok { color: #1E8449; }
        .send-status.fail { color: var(--danger); }
        .send-status.wait { color: #7F8C8D; }
    </style>
</head>
<body>

<div class="quiz-container" id="quiz-app">
    <div id="start-screen">
        <h1>이름을 알려 주세요 ✏️</h1>
        <div class="subtitle">5학년 사회 단원평가</div>
        <label class="field-label" for="num-select">출석번호</label>
        <select id="num-select" class="in-field"><option value="">번호를 골라 주세요</option></select>
        <label class="field-label" for="name-input">이름</label>
        <input type="text" id="name-input" class="in-field" placeholder="이름을 입력해 주세요" maxlength="10" autocomplete="off">
        <div class="start-msg" id="start-msg" role="alert" hidden></div>
        <button class="btn" id="start-btn" style="width:100%;margin-top:10px">시작하기 ➔</button>
    </div>
    <div id="game-screen" style="display:none">
        <h1 id="main-title">법과 인권 박사 도전! ⚖️</h1>
        <div class="subtitle">5학년 1학기 사회: 3단원 법과 인권의 보장 종합 평가</div>
        <div class="progress-bar"><div class="progress" id="progress"></div></div>
        
        <div class="stats">
            <span id="question-number">문제 1 / 25</span>
            <span id="score-display">점수: 0점</span>
        </div>
        
        <div class="question-box" id="question-text">문제를 불러오는 중입니다...</div>
        <div class="options-container" id="options-box"></div>
        
        <div class="hint-box" id="hint-box"></div>
        
        <div class="control-panel">
            <button class="btn" id="hint-btn" onclick="showHint()">💡 힌트 보기 (-2점)</button>
            <button class="btn" id="next-btn" onclick="nextQuestion()" disabled>다음 문제 ➔</button>
        </div>

        <div class="feedback-box" id="feedback-box"></div>
    </div>

    <div id="result-screen" class="result-screen">
        <h1>🎉 법과 인권 탐험 완료! 🎉</h1>
        <div class="subtitle">법과 인권의 보장 최종 결과</div>
        <div class="result-score" id="final-score">100 / 100점</div>
        <div class="comment" id="final-comment">멋집니다!</div>
        <div class="send-status wait" id="send-status" role="status">결과를 선생님께 보내는 중이에요...</div>
        <button class="btn" id="retry-btn" hidden style="margin-bottom:14px">다시 보내기</button><br>
        <button class="btn" onclick="restartGame()">다시 도전하기 🔄</button>
    </div>
</div>

    function shuffleArray(array) {
        const arr = array.slice();
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    const nextBtn = document.getElementById('next-btn');

    function initQuiz() {
        isAnswered = false;
        usedHint = false;
        nextBtn.disabled = true;
        feedbackBox.style.display = 'none';
        hintBox.style.display = 'none';
        
        let currentQ = quizData[currentIdx];
        qText.innerText = `${currentIdx + 1}. ${currentQ.q}`;
        qNumText.innerText = `문제 ${currentIdx + 1} / ${quizData.length}`;
        scoreText.innerText = `점수: ${score}점`;
        progress.style.width = `${((currentIdx) / quizData.length) * 100}%`;

        // 선택지 순서를 매번 랜덤하게 섞고, 정답 인덱스도 함께 갱신
        const indices = shuffleArray(currentQ.options.map((_, i) => i));
        shuffledOptions = indices.map(i => currentQ.options[i]);
        shuffledAnswer = indices.indexOf(currentQ.answer);
        currentShuffle = indices;
        
        optionsBox.innerHTML = '';
        shuffledOptions.forEach((opt, index) => {
            const button = document.createElement('button');
            button.className = 'option-btn';
            button.innerText = opt;
            button.onclick = () => checkAnswer(index, button);
            optionsBox.appendChild(button);
        });
    }

    function checkAnswer(selectedIdx, selectedBtn) {
        if (isAnswered) return;
        isAnswered = true;
        
        let currentQ = quizData[currentIdx];
        const buttons = optionsBox.getElementsByClassName('option-btn');
        records.push({ q: currentIdx + 1, selected: String(currentShuffle[selectedIdx] + 1), correct: selectedIdx === shuffledAnswer, hint: usedHint });
        
        if (selectedIdx === shuffledAnswer) {
            selectedBtn.classList.add('correct');
            if (usedHint) {
                score += 2; // 힌트 사용 시 기본 4점에서 -2점 감점 적용
                feedbackBox.innerHTML = `<strong>⭕ 정답입니다! (💡 힌트 사용 감점 -2점 적용)</strong><br>${currentQ.rationale}`;
            } else {
                score += 4; // 문제당 4점 (25문항 x 4점 = 100점 만점)
                feedbackBox.innerHTML = `<strong>⭕ 정답입니다!</strong><br>${currentQ.rationale}`;
            }
        } else {
            selectedBtn.classList.add('wrong');
            buttons[shuffledAnswer].classList.add('correct');
            feedbackBox.innerHTML = `<strong>❌ 오답입니다. 정답과 해설을 확인해 보세요!</strong><br>${currentQ.rationale}`;
        }
        
        scoreText.innerText = `점수: ${score}점`;
        feedbackBox.style.display = 'block';
        nextBtn.disabled = false;
    }

        const msg = document.getElementById('start-msg');
        if (num === '') { msg.textContent = '출석번호를 골라 주세요.'; msg.hidden = false; return; }
        if (typed === '') { msg.textContent = '이름을 입력해 주세요.'; msg.hidden = false; return; }
        msg.hidden = true;
        playerNumber = Number(num); playerName = typed;
        document.getElementById('start-screen').style.display = 'none';
        gameScreen.style.display = 'block';
        initQuiz();
    });
    async function sendResult() {
        const st = document.getElementById('send-status'), rb = document.getElementById('retry-btn');
        if (sent || sending) return;
        sending = true; rb.hidden = true;
        st.className = 'send-status wait'; st.textContent = '결과를 선생님께 보내는 중이에요...';
        try {
            const res = await fetch(SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(lastPayload) });
            const j = await res.json();
            if (!j.ok) throw new Error(j.error || 'fail');
            sent = true; st.className = 'send-status ok'; st.textContent = '✅ 결과가 선생님께 전달되었어요!';
        } catch (e) {
            st.className = 'send-status fail'; st.textContent = '⚠️ 결과를 보내지 못했어요. 인터넷 연결을 확인하고 [다시 보내기]를 눌러 주세요. 계속 안 되면 이 화면을 선생님께 보여 주세요.'; rb.hidden = false;
        }
        sending = false;
    }
    document.getElementById('retry-btn').addEventListener('click', sendResult);
</script>
</body>
</html>
