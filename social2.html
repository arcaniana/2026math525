<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5학년 2학기 사회 2단원 퀴즈 게임</title>
    <style>
        :root {
            --primary: #4A90E2;
            --primary-dark: #357ABD;
            --success: #2ECC71;
            --danger: #E74C3C;
            --background: #F5F7FA;
            --card-bg: #FFFFFF;
            --text: #2C3E50;
        }

        * { box-sizing: border-box; font-family: 'Malgun Gothic', sans-serif; }
        body { background-color: var(--background); color: var(--text); margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .quiz-container { background: var(--card-bg); width: 100%; max-width: 700px; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); transition: all 0.3s ease; }
        h1 { text-align: center; color: var(--primary); font-size: 24px; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #7F8C8D; font-size: 14px; margin-bottom: 25px; }
        .progress-bar { width: 100%; height: 10px; background-color: #ECF0F1; border-radius: 5px; margin-bottom: 25px; overflow: hidden; }
        .progress { height: 100%; background-color: var(--primary); width: 0%; transition: width 0.3s ease; }
        .stats { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 15px; font-size: 16px; }
        .question-box { font-size: 18px; font-weight: bold; line-height: 1.6; margin-bottom: 25px; min-height: 60px; }
        .options-container { display: flex; flex-direction: column; gap: 12px; }
        .option-btn { background: #F8F9FA; border: 2px solid #E2E8F0; border-radius: 12px; padding: 15px 20px; font-size: 16px; text-align: left; cursor: pointer; transition: all 0.2s; font-weight: 500; -webkit-tap-highlight-color: transparent; }
        .option-btn:hover { background: #EDF2F7; border-color: #CBD5E0; }
        .option-btn.correct { background-color: #D4EDDA !important; border-color: var(--success) !important; color: #155724; font-weight: bold; }
        .option-btn.wrong { background-color: #F8D7DA !important; border-color: var(--danger) !important; color: #721C24; }
        .hint-box { margin-top: 15px; padding: 12px; border-radius: 10px; background-color: #FEFCBF; border: 1px dashed #D69E2E; color: #744210; font-size: 14px; display: none; }
        .control-panel { display: flex; justify-content: space-between; margin-top: 25px; }
        .btn { background-color: var(--primary); color: white; border: none; border-radius: 10px; padding: 12px 25px; font-size: 16px; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        .btn:hover { background-color: var(--primary-dark); }
        .btn:disabled { background-color: #CBD5E0; cursor: not-allowed; }
        .feedback-box { margin-top: 20px; padding: 15px; border-radius: 12px; background-color: #EBF8FF; border-left: 5px solid var(--primary); display: none; line-height: 1.5; font-size: 15px; }
        .result-screen { text-align: center; display: none; }
        .result-score { font-size: 48px; font-weight: bold; color: var(--primary); margin: 20px 0; }
        .comment { font-size: 18px; line-height: 1.6; margin-bottom: 30px; }
        .start-screen { text-align: center; }
        .start-icon { font-size: 56px; margin-bottom: 10px; }
        .name-input { width: 100%; padding: 14px 16px; font-size: 16px; border: 2px solid #E2E8F0; border-radius: 12px; margin: 20px 0; text-align: center; font-weight: 500; }
        .name-input:focus { outline: none; border-color: var(--primary); }
        .start-btn { width: 100%; }
        .player-name { color: var(--primary); }
        [hidden] { display: none !important; }
        .field-label { display: block; text-align: left; font-weight: 700; font-size: 14px; color: #7F8C8D; margin: 14px 0 -10px; }
        .start-msg { color: var(--danger); font-weight: 700; font-size: 14px; margin: -8px 0 14px; }
        .send-status { font-size: 15px; font-weight: 700; margin: 0 0 14px; line-height: 1.5; }
        .send-status.ok { color: #1E8449; }
        .send-status.fail { color: var(--danger); }
        .send-status.wait { color: #7F8C8D; }
    </style>
</head>
<body>

<div class="quiz-container" id="quiz-app">
    <div id="start-screen" class="start-screen">
        <div class="start-icon">🏯</div>
        <h1>달라지는 시대, 변화하는 생활 모습</h1>
        <div class="subtitle">5학년 2학기 사회: 2단원 달라지는 시대, 변화하는 생활 모습</div>
        <label class="field-label" for="num-select">출석번호</label>
        <select id="num-select" class="name-input num-select"><option value="">번호를 골라 주세요</option></select>
        <label class="field-label" for="name-input">이름</label>
        <input type="text" id="name-input" class="name-input" placeholder="이름을 입력해 주세요" maxlength="10" autocomplete="off">
        <div class="start-msg" id="start-msg" role="alert" hidden></div>
        <button class="btn start-btn" onclick="startGame()">탐험 시작하기 🚀</button>
    </div>

    <div id="game-screen" style="display:none;">
        <h1>달라지는 시대, 변화하는 생활 모습 🏯</h1>
        <div class="subtitle">5학년 2학기 사회: 2단원 달라지는 시대, 변화하는 생활 모습</div>
        <div class="progress-bar"><div class="progress" id="progress"></div></div>

        <div class="stats">
            <span id="question-number">문제 1 / 25</span>
            <span id="score-display">점수: 0점</span>
        </div>

        <div class="question-box" id="question-text">문제가 여기에 나타납니다.</div>
        <div class="options-container" id="options-box"></div>

        <div class="hint-box" id="hint-box"></div>

        <div class="control-panel">
            <button class="btn" id="hint-btn" onclick="showHint()">💡 힌트 보기 (-2점)</button>
            <button class="btn" id="next-btn" onclick="nextQuestion()" disabled>다음 문제 ➔</button>
        </div>

        <div class="feedback-box" id="feedback-box"></div>
    </div>

    <div id="result-screen" class="result-screen">
        <h1>🎉 탐험 완료! 🎉</h1>
        <div class="subtitle"><span class="player-name" id="result-name">탐험가</span>님의 달라지는 시대, 변화하는 생활 모습 단원평가 결과</div>
        <div class="result-score" id="final-score">100 / 100</div>
        <div class="comment" id="final-comment">멋집니다! 조선의 건국부터 근대의 변화까지 완벽하게 이해하고 있군요!</div>
        <div class="send-status wait" id="send-status" role="status">결과를 선생님께 보내는 중이에요...</div>
        <button class="btn" id="retry-btn" hidden style="margin-bottom:14px">다시 보내기</button><br>
        <button class="btn" onclick="restartGame()">다시 도전하기 🔄</button>
    </div>
</div>

<script>

    // 배열을 무작위로 섞어 새 배열을 반환합니다 (Fisher-Yates shuffle).
    function shuffleArray(array) {
        const arr = array.slice();
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function startGame() {
        const num = document.getElementById('num-select').value, typed = nameInput.value.trim();
        const msg = document.getElementById('start-msg');
        if (num === '') { msg.textContent = '출석번호를 골라 주세요.'; msg.hidden = false; return; }
        if (typed === '') { msg.textContent = '이름을 입력해 주세요.'; msg.hidden = false; return; }
        msg.hidden = true;
        playerNumber = Number(num);
        playerName = typed;
        startScreen.style.display = 'none';
        gameScreen.style.display = 'block';
        initQuiz();
    }

    nameInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') startGame();
    });

    function initQuiz() {
        isAnswered = false;
        usedHint = false;
        nextBtn.disabled = true;
        feedbackBox.style.display = 'none';
        hintBox.style.display = 'none';

        let currentQ = quizData[currentIdx];
        qText.innerText = `${currentIdx + 1}. ${currentQ.q}`;
        qNumText.innerText = `문제 ${currentIdx + 1} / ${quizData.length}`;
        scoreText.innerText = `점수: ${score}점`;
        progress.style.width = `${((currentIdx) / quizData.length) * 100}%`;

        // 선택지 순서를 문제가 나올 때마다 무작위로 섞습니다.
        const originalIndices = currentQ.options.map((opt, idx) => idx);
        const shuffledIndices = shuffleArray(originalIndices);
        currentAnswerIdx = shuffledIndices.indexOf(currentQ.answer);
        currentShuffle = shuffledIndices;

        optionsBox.innerHTML = '';
        shuffledIndices.forEach((originalIdx, displayIdx) => {
            const button = document.createElement('button');
            button.className = 'option-btn';
            button.innerText = currentQ.options[originalIdx];
            button.onclick = () => checkAnswer(displayIdx, button);
            optionsBox.appendChild(button);
        });
    }

    function checkAnswer(selectedIdx, selectedBtn) {
        if (isAnswered) return;
        isAnswered = true;

        let currentQ = quizData[currentIdx];
        const buttons = optionsBox.getElementsByClassName('option-btn');
        records.push({ q: currentIdx + 1, selected: String(currentShuffle[selectedIdx] + 1), correct: selectedIdx === currentAnswerIdx, hint: usedHint });

        if (selectedIdx === currentAnswerIdx) {
            selectedBtn.classList.add('correct');

            if (usedHint) {
                score += 2;
                feedbackBox.innerHTML = `<strong>⭕ 정답입니다! (힌트 사용 -2점 감점 적용)</strong><br>${currentQ.rationale}`;
            } else {
                score += 4;
                feedbackBox.innerHTML = `<strong>⭕ 정답입니다!</strong><br>${currentQ.rationale}`;
            }
        } else {
            selectedBtn.classList.add('wrong');
            buttons[currentAnswerIdx].classList.add('correct');
            feedbackBox.innerHTML = `<strong>❌ 아쉬워요!</strong><br>${currentQ.rationale}`;
        }

        scoreText.innerText = `점수: ${score}점`;
        feedbackBox.style.display = 'block';
        nextBtn.disabled = false;
    }

        if (isAnswered) return;
        usedHint = true;
        hintBox.innerText = `💡 힌트: ${quizData[currentIdx].hint}`;
        hintBox.style.width = "auto";
        hintBox.style.display = 'block';
    }

    function nextQuestion() {
        currentIdx++;
        if (currentIdx < quizData.length) {
            initQuiz();
        } else {
            showResult();
        }
    }

    function showResult() {
        gameScreen.style.display = 'none';
        resultScreen.style.display = 'block';
        resultName.innerText = playerName;
        document.getElementById('final-score').innerText = `${score} / 100점`;

        let comment = "";
        if (score >= 92) comment = `🏅 완벽해요! ${playerName}님을 달라지는 시대, 변화하는 생활 모습의 달인으로 임명합니다!`;
        else if (score >= 70) comment = `👍 훌륭합니다, ${playerName}님! 헷갈렸던 문제들의 해설을 한 번 더 읽어보세요!`;
        else comment = `📖 ${playerName}님, 조금 더 공부해 볼까요? 다시 풀면 훨씬 더 잘할 수 있어요!`;

        sent = false; sending = false;
        sendResult();
    }

    function restartGame() {
        currentIdx = 0;
        score = 0;
        records = [];
        gameScreen.style.display = 'block';
        resultScreen.style.display = 'none';
        initQuiz();

    for (let n = 1; n <= MAX_NUMBER; n++) { const o = document.createElement('option'); o.value = n; o.textContent = n + '번'; document.getElementById('num-select').appendChild(o); }
    async function sendResult() {
        const st = document.getElementById('send-status'), rb = document.getElementById('retry-btn');
        if (sent || sending) return;
        if (!SCRIPT_URL) { st.className = 'send-status fail'; st.textContent = '⚠️ 전송 주소가 설정되지 않았어요. 이 화면을 선생님께 보여 주세요.'; return; }

        st.className = 'send-status wait'; st.textContent = '결과를 선생님께 보내는 중이에요...';
        try {
            const res = await fetch(SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(lastPayload) });

            if (!j.ok) throw new Error(j.error || 'fail');
            sent = true; st.className = 'send-status ok'; st.textContent = '✅ 결과가 선생님께 전달되었어요!';

            st.className = 'send-status fail'; st.textContent = '⚠️ 결과를 보내지 못했어요. 인터넷 연결을 확인하고 [다시 보내기]를 눌러 주세요. 계속 안 되면 이 화면을 선생님께 보여 주세요.'; rb.hidden = false;
        }
        sending = false;
    }
    document.getElementById('retry-btn').addEventListener('click', sendResult);

    // 첫 실행은 이름 입력 화면에서 시작하며, startGame() 호출 시 initQuiz()가 실행됩니다.

<script>
/* 시험은 최대 3회차까지만 (서버 기록 기준) */
(function () {
  var MAXA = 3;
  var sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
  async function attempts(num) {
    try {
      var r = await fetch(SCRIPT_URL + '?action=count&unit=' + encodeURIComponent(UNIT_NAME) + '&number=' + encodeURIComponent(num));
      var j = await r.json();
      return j.ok ? Number(j.count) : null;
    } catch (e) { return null; }
  }
  var origStart = window.startGame, origRestart = window.restartGame, busy = false;
  if (origStart) window.startGame = async function () {
    if (busy) return;
    var sel = document.getElementById('num-select'), msg = document.getElementById('start-msg');
    if (!sel || sel.value === '') return origStart();
    busy = true;
    var c = await attempts(sel.value);
    busy = false;
    if (c !== null && c >= MAXA) {
      msg.textContent = sel.value + '번은 이미 ' + MAXA + '번 모두 응시했어요. 더 이상 볼 수 없어요. (번호를 잘못 골랐다면 다시 골라 주세요)';
      msg.hidden = false; return;
    }
    origStart();
  };
  if (origRestart) window.restartGame = async function () {
    for (var i = 0; i < 20; i++) { if (typeof sending !== 'undefined' && sending) await sleep(300); else break; }
    var c = await attempts(typeof playerNumber !== 'undefined' ? playerNumber : '');
    if (c !== null && c >= MAXA) { alert(MAXA + '번 모두 응시했어요. 더 이상 다시 도전할 수 없어요.'); return; }
    origRestart();
  };
})();
</script>
