<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>5학년 2학기 영어 Lesson 08 She Has Long Curly Hair 퀴즈</title>
<style>
:root{--primary:#2E86DE;--primary-dark:#1B6AB8;--success:#2ECC71;--danger:#E74C3C;--background:#F5F7FA;--card-bg:#FFF;--text:#2C3E50}
*{box-sizing:border-box;font-family:'Malgun Gothic','Noto Sans KR',sans-serif}
body{background:var(--background);color:var(--text);margin:0;padding:20px;display:flex;justify-content:center;align-items:center;min-height:100vh}
.quiz-container{background:var(--card-bg);width:100%;max-width:700px;padding:30px;border-radius:20px;box-shadow:0 10px 25px rgba(0,0,0,.08)}
h1{text-align:center;color:var(--primary);font-size:22px;margin-bottom:5px}
.subtitle{text-align:center;color:#7F8C8D;font-size:14px;margin-bottom:25px}
.progress-bar{width:100%;height:10px;background:#ECF0F1;border-radius:5px;margin-bottom:25px;overflow:hidden}
.progress{height:100%;background:var(--primary);width:0;transition:width .3s}
.stats{display:flex;justify-content:space-between;font-weight:bold;margin-bottom:15px;font-size:16px}
.qprompt{font-size:17px;font-weight:700;line-height:1.6;margin-bottom:12px}
.badge{display:inline-block;background:#EBF5FF;color:var(--primary-dark);border-radius:20px;padding:4px 12px;font-size:13px;font-weight:700;margin-bottom:10px}
.dlg{background:#F8FAFC;border:1px solid #E2E8F0;border-radius:12px;padding:12px 16px;margin:10px 0;line-height:1.9;font-size:16px}
.wd{font-size:24px;letter-spacing:2px;text-align:center;margin:8px 0;font-weight:700}
.ans-line{margin:10px 0;font-size:17px;line-height:2.2}
.qimgs{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:10px 0}
.qimgs img{max-width:100%;max-height:260px;border:1px solid #E2E8F0;border-radius:12px;background:#fff}
.answer-buttons{display:grid;gap:10px;margin:12px 0 8px}
.answer-buttons.nums{grid-template-columns:repeat(5,1fr)}
.answer-buttons.list{grid-template-columns:1fr}
.answer-buttons.pics{grid-template-columns:repeat(3,1fr)}
.answer-btn{background:#F8F9FA;border:2px solid #E2E8F0;border-radius:12px;padding:14px 12px;font-size:17px;font-weight:700;text-align:left;cursor:pointer;color:#4A5568;-webkit-tap-highlight-color:transparent}
.answer-buttons.nums .answer-btn{font-size:22px;text-align:center;padding:16px 0}
.answer-buttons.pics .answer-btn{text-align:center;padding:8px}
.answer-buttons.pics img{max-width:100%;display:block;margin:4px auto 0}
.answer-btn:hover{background:#EDF2F7}
.answer-btn.selected{background:#DCEBFA;border-color:var(--primary);color:var(--primary-dark)}
.answer-btn:disabled{cursor:not-allowed;opacity:.55}
.fill{border:0;border-bottom:2px solid var(--primary);background:#F0F7FF;font-size:17px;padding:4px 8px;text-align:center;min-width:90px;width:140px;border-radius:6px 6px 0 0}
.fill.wide{width:100%;max-width:100%}
.fill.sel{min-width:80px;width:auto;padding:4px 2px}
.fill:focus{outline:none;background:#E1EFFF}
.hint-box{margin-top:15px;padding:12px;border-radius:10px;background:#FEFCBF;border:1px dashed #D69E2E;color:#744210;font-size:14px;display:none;line-height:1.6}
.control-panel{display:flex;justify-content:space-between;margin-top:25px;gap:10px}
.btn{background:var(--primary);color:#fff;border:none;border-radius:10px;padding:12px 25px;font-size:16px;cursor:pointer;font-weight:bold}
.btn:hover{background:var(--primary-dark)}
.btn:disabled{background:#CBD5E0;cursor:not-allowed}
.result-screen{text-align:center;display:none}
.result-score{font-size:48px;font-weight:bold;color:var(--primary);margin:20px 0}
.comment{font-size:18px;line-height:1.6;margin-bottom:20px}
.start-screen{text-align:center}
.start-icon{font-size:56px;margin-bottom:10px}
.name-input{width:100%;padding:14px 16px;font-size:16px;border:2px solid #E2E8F0;border-radius:12px;margin:20px 0;text-align:center;font-weight:500}
.name-input:focus{outline:none;border-color:var(--primary)}
.start-btn{width:100%}
.player-name{color:var(--primary)}
.review-section{text-align:left;margin-top:10px}
.review-summary{display:flex;justify-content:space-around;margin-bottom:15px;font-weight:bold}
.correct-count{color:var(--success)}.wrong-count{color:var(--danger)}
.review-list{max-height:340px;overflow-y:auto;border:1px solid #E2E8F0;border-radius:12px;padding:4px 15px}
.review-item{padding:12px 0;border-bottom:1px solid #F0F0F0;font-size:14px;line-height:1.5}
.review-item:last-child{border-bottom:none}
.review-item .rtitle{font-weight:bold;margin-bottom:4px}
.review-item.correct .rtitle{color:#1E8449}.review-item.wrong .rtitle{color:#C0392B}.review-item.part .rtitle{color:#B7791F}
[hidden]{display:none!important}
.field-label{display:block;text-align:left;font-weight:700;font-size:14px;color:#7F8C8D;margin:14px 0 -10px}
.start-msg{color:#E74C3C;font-weight:700;font-size:14px;margin:-8px 0 14px}
.send-status{font-size:15px;font-weight:700;margin:0 0 14px;line-height:1.5}
.send-status.ok{color:#1E8449}.send-status.fail{color:#E74C3C}.send-status.wait{color:#7F8C8D}
@media(max-width:520px){.quiz-container{padding:20px 16px}.answer-buttons.nums{grid-template-columns:repeat(5,1fr);gap:6px}}
</style>
</head>
<body>
<div class="quiz-container">
 <div id="start-screen" class="start-screen">
  <div class="start-icon">👧</div>
  <h1>Lesson 08 She Has Long Curly Hair</h1>
  <div class="subtitle">5학년 2학기 영어: 단원 평가 (10문제 · 듣기는 선생님이 들려줘요 🎧)</div>
  <label class="field-label" for="num-select">출석번호</label>

  <label class="field-label" for="name-input">이름</label>

  <div class="start-msg" id="start-msg" role="alert" hidden></div>
  <button class="btn start-btn" onclick="startGame()">문제 풀기 시작 🚀</button>
 </div>
 <div id="game-screen" style="display:none">

  <div class="stats"><span id="question-number"></span><span id="score-display"></span></div>
  <div id="qbox"></div>
  <div class="hint-box" id="hint-box"></div>
  <div class="control-panel">
   <button class="btn" id="hint-btn" onclick="showHint()">💡 힌트 보기 (-2점)</button>
   <button class="btn" id="next-btn" onclick="nextQuestion()" disabled>다음 문제 ➔</button>
  </div>
 </div>
 <div id="result-screen" class="result-screen">

  <div class="subtitle"><span class="player-name" id="result-name">친구</span>님의 영어 단원평가 결과</div>
  <div class="result-score" id="final-score"></div>
  <div class="comment" id="final-comment"></div>
  <div class="send-status wait" id="send-status" role="status"></div>
  <button class="btn" id="retry-btn" hidden style="margin-bottom:18px">다시 보내기</button>
  <div class="review-section">
   <div class="review-summary"><span class="correct-count" id="correct-summary"></span><span class="wrong-count" id="wrong-summary"></span></div>
   <div class="review-list" id="review-list"></div>
  </div>
  <div class="control-panel" style="justify-content:center;margin-top:20px"><button class="btn" onclick="restartGame()">다시 도전하기 🔄</button></div>
 </div>
</div>

    const cls=hasPics?'pics':(q.opts?'list':'nums');
    h+=`<div class="answer-buttons ${cls}" id="answer-buttons">`;
    const n=q.opts?q.opts.length:q.n;
    for(let i=1;i<=n;i++){
      let inner=LAB[i-1];
      if(q.opts){const o=q.opts[i-1];inner=hasPics?`${LAB[i-1]}<img src="${o.img}" alt="">`:`${LAB[i-1]} ${esc(o)}`;}
      h+=`<button class="answer-btn" data-i="${i}">${inner}</button>`;
    }
    h+='</div>';
    $('qbox').innerHTML=h;
    document.querySelectorAll('#answer-buttons .answer-btn').forEach(b=>b.onclick=()=>pick(Number(b.dataset.i),b));
  }else{
    const body=q.body.replace(/\[\[(\d+)\]\]/g,(m,i)=>{
      const wide=(q.fields.length===1&&/\s/.test(q.fields[0].ans[0])&&q.fields[0].kind==='en'&&q.fields[0].ans[0].split(' ').length>3);
      const f=q.fields[i];
      if(f.kind==='sel')return `<select class="fill sel" data-f="${i}"><option value="">선택</option>${f.opts.map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('')}</select>`;
      return `<input class="fill${wide?' wide':''}" data-f="${i}" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">`;
    });
    $('qbox').innerHTML=h+body;
  }
  $('next-btn').innerText=currentIdx===quizData.length-1?'결과 보기 🏁':'다음 문제 ➔';
}
function pick(i,btn){
  if(answered)return;
  const q=quizData[currentIdx];
  if(q.multi){
    const k=sel.indexOf(i);
    if(k>=0){sel.splice(k,1);btn.classList.remove('selected');}else{sel.push(i);btn.classList.add('selected');}
    $('next-btn').disabled=sel.length===0;
    return;
  }
  sel=[i];
  document.querySelectorAll('#answer-buttons .answer-btn').forEach(b=>{b.classList.remove('selected');});
  btn.classList.add('selected');
  $('next-btn').disabled=false;
}
function showHint(){
  usedHint=true;
  $('hint-box').innerText='💡 힌트: '+quizData[currentIdx].hint;
  $('hint-box').style.display='block';
}
function normEn(s){return s.replace(/[‘’`´]/g,"'").replace(/\s+/g,' ').trim().replace(/\.$/,'').trim();}
function normKo(s){return s.replace(/\s+/g,'').replace(/[()]/g,'');}
function checkField(f,v){
  if(f.kind==='sel')return v===f.ans[0];
  if(f.kind==='en'){
    let x=normEn(v);
    return f.ans.some(a=>{let y=normEn(a);return f.ci?x.toLowerCase()===y.toLowerCase():x===y;});
  }
  const x=normKo(v);
  return f.groups.every(g=>g.some(k=>x.includes(k)));
}
function gradeQ(q){
  // returns {pts, sel(string), full}
  if(q.t==='mc'){
    const a=q.answer.slice().sort().join(),s=sel.slice().sort().join();
    const ok=a===s;
    return{pts:ok?POINTS_PER_Q:0,txt:sel.slice().sort().join('+'),full:ok};
  }
  const vals=Array.from(document.querySelectorAll('#qbox .fill')).map(e=>e.value);
  const res=q.fields.map((f,i)=>checkField(f,vals[i]||''));
  let pts=0;
  if(q.custom==='bath'){
    const v=normEn(vals[0]||'');
    if(v==='There is a bath in the bathroom')pts=POINTS_PER_Q;
    else{
      const l=v.toLowerCase();
      const a=/\ba bath\b/.test(l),b=/\bthe bathroom\b/.test(l);
      if(a!==b)pts=POINTS_PER_Q/2;
    }
  }else if(q.mode==='partial'){
    pts=res.filter(Boolean).length*(POINTS_PER_Q/q.fields.length);
  }else{
    pts=res.every(Boolean)?POINTS_PER_Q:0;
  }
  return{pts,txt:vals.map(v=>v.trim()).join(' / '),full:pts===POINTS_PER_Q};
}
function nextQuestion(){
  const q=quizData[currentIdx];
  const g=gradeQ(q);
  let earn=g.pts;
  if(usedHint&&earn>0)earn=Math.max(0,earn-HINT_PENALTY);
  records.push({qNum:currentIdx+1,selected:g.txt,earn:earn,full:g.full,part:(!g.full&&g.pts>0),usedHint:usedHint,hint:q.hint});
  currentIdx++;
  if(currentIdx<quizData.length)initQuiz();else showResult();
}
function showResult(){
  $('game-screen').style.display='none';$('result-screen').style.display='block';
  $('result-name').innerText=playerName;
  const score=records.reduce((s,r)=>s+r.earn,0);
  const full=records.filter(r=>r.full),wrong=records.filter(r=>!r.full);
  $('final-score').innerText=`${score} / ${maxScore}점`;
  lastPayload={unit:UNIT_NAME,number:playerNumber,name:playerName,score:score,max:maxScore,correctCount:full.length,clientTime:new Date().toISOString(),
    answers:records.map(r=>({q:r.qNum,selected:r.selected,correct:r.full,hint:r.usedHint}))};
  sent=false;sending=false;sendResult();
  const pct=score/maxScore*100;
  $('final-comment').innerText=pct>=90?`🏅 Great job! ${playerName}님, 영어 실력이 최고예요!`:pct>=70?`👍 잘했어요, ${playerName}님! 틀린 문제의 힌트를 한 번 더 읽어 보세요!`:`📖 ${playerName}님, 조금 더 연습해 볼까요? 아래 힌트를 보며 복습해 보세요!`;
  $('correct-summary').innerText=`✅ 맞은 문제: ${full.length}개`;
  $('wrong-summary').innerText=`❌ 틀린 문제: ${wrong.length}개`;
  const rl=$('review-list');rl.innerHTML='';
  wrong.forEach(r=>{const d=document.createElement('div');d.className='review-item '+(r.part?'part':'wrong');
    d.innerHTML=`<div class="rtitle"><span>${r.part?'🔺':'❌'}</span> ${r.qNum}번 문제${r.part?' (일부만 맞았어요)':''}</div><div>💡 ${esc(r.hint)}</div>`;rl.appendChild(d);});
  full.forEach(r=>{const d=document.createElement('div');d.className='review-item correct';
    d.innerHTML=`<div class="rtitle"><span>✅</span> ${r.qNum}번 문제${r.usedHint?' (힌트 사용)':''}</div>`;rl.appendChild(d);});
}
function restartGame(){currentIdx=0;records=[];$('game-screen').style.display='block';$('result-screen').style.display='none';initQuiz();}
async function sendResult(){
  const st=$('send-status'),rb=$('retry-btn');
  if(sent||sending)return;
  sending=true;rb.hidden=true;st.className='send-status wait';st.textContent='결과를 선생님께 보내는 중이에요...';
  try{
    const res=await fetch(SCRIPT_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(lastPayload)});
    const j=await res.json();if(!j.ok)throw new Error(j.error||'fail');
    sent=true;st.className='send-status ok';st.textContent='✅ 결과가 선생님께 전달되었어요!';
  }catch(e){
    st.className='send-status fail';st.textContent='⚠️ 결과를 보내지 못했어요. 인터넷 연결을 확인하고 [다시 보내기]를 눌러 주세요. 계속 안 되면 이 화면을 선생님께 보여 주세요.';rb.hidden=false;
  }
  sending=false;
}
$('retry-btn').addEventListener('click',sendResult);
</script>
<script>
/* 시험은 최대 3회차까지만 (서버 기록 기준) */
(function () {
  var MAXA = 3;
  var sleep = function (ms) { return new Promise(function (r) { setTimeout(r, ms); }); };
  async function attempts(num) {
    try {
      var r = await fetch(SCRIPT_URL + '?action=count&unit=' + encodeURIComponent(UNIT_NAME) + '&number=' + encodeURIComponent(num));
      var j = await r.json();
      return j.ok ? Number(j.count) : null;
    } catch (e) { return null; }
  }
  var origStart = window.startGame, origRestart = window.restartGame, busy = false;
  if (origStart) window.startGame = async function () {
    if (busy) return;
    var sel = document.getElementById('num-select'), msg = document.getElementById('start-msg');
    if (!sel || sel.value === '') return origStart();
    busy = true;
    var c = await attempts(sel.value);
    busy = false;
    if (c !== null && c >= MAXA) {
      msg.textContent = sel.value + '번은 이미 ' + MAXA + '번 모두 응시했어요. 더 이상 볼 수 없어요. (번호를 잘못 골랐다면 다시 골라 주세요)';
      msg.hidden = false; return;
    }
    origStart();
  };
  if (origRestart) window.restartGame = async function () {
    for (var i = 0; i < 20; i++) { if (typeof sending !== 'undefined' && sending) await sleep(300); else break; }
    var c = await attempts(typeof playerNumber !== 'undefined' ? playerNumber : '');
    if (c !== null && c >= MAXA) { alert(MAXA + '번 모두 응시했어요. 더 이상 다시 도전할 수 없어요.'); return; }
    origRestart();
  };
})();
</script>
